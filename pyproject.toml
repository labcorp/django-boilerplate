[project]
name = "django-vat-boilerplate"
version = "0.2.0"
description = "Simple and effective Django boilerplace with Vite, Alpine.js and Tailwind. Dockerfile ready for production."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django==6.*",
    "django-admin-interface>=0.31.1",
    "django-admin-sortable2>=2.3",
    "django-cotton>=2.5.1",
    "django-environ>=0.12.0",
    "django-extensions>=4.1",
    "django-filer>=3.4.1",
    "django-tinymce>=5.0.0",
    "django-vite>=3.1.0",
    "django-storages[boto3]>=1.14",
    "djangoql>=0.18.1",
    "djangorestframework>=3.16.1",
    "djangorestframework-simplejwt>=5.5.1",
    "docutils>=0.22",
    "drf-spectacular>=0.29.0",
    "easy-thumbnails>=2.10.1",
    "gunicorn>=23.0.0",
    "markdown>=3.10",
    "pillow>=12.0.0",
    "psycopg2-binary>=2.9.11",
    "pytz>=2025.2",
    "tzdata>=2025.3",
    "whitenoise>=6.11.0",
    "celery[redis]>=5.4.0",
    "django-celery-results>=2.6.0",
    "django-htmx>=1.23.2",
    "django-allauth[mfa]>=65.18.0",
    "django-hijack>=3.7.8",
    "django-auditlog>=3.4.1",
    "django-solo>=2.5.1",
    "django-anymail[resend]>=15.1",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.16",
    "ipython>=9.5.0",
    "pylint>=3.3.8",
    "pylint-django>=2.6.1",
]
